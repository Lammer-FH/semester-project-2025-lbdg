version: '3.8'

services:
  persistance:
    image: mysql:8.0
    container_name: persistance
    environment:
      MYSQL_ROOT_PASSWORD: pwd1234
      MYSQL_DATABASE: lbdg
      MYSQL_USER: admin
      MYSQL_PASSWORD: pwd1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - springboot-network

volumes:
  mysql-data:

networks:
  springboot-network:
